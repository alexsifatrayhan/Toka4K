name: Build Toka4K Premium APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # Corrupt wrapper ko bypass karne ke liye direct GitHub ke safe official action ka use karenge
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7 # Direct target version load karega bina local jar file ke

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon # Yahan './gradlew' nahi sirf 'gradle' chalega

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Toka4K-Premium-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
